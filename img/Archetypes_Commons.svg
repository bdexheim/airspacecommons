<text x="682.7" y="858" font-size="13" font-weight="600" fill="#0B2341" text-anchor="middle">Ecology</text>
<text x="500" y="886.0" font-size="13" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">agencies plug in; CDPH is the first</text>
