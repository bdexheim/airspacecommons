<text x="483.6" y="858" font-size="13" font-weight="600" fill="#0B2341" text-anchor="middle">Transportation</text>
<rect x="564.0" y="840" width="67.0" height="26" rx="13" fill="none" stroke="#5B6B7A" stroke-width="1.5"/>
<text x="597.5" y="858" font-size="13" font-weight="600" fill="#0B2341" text-anchor="middle">Water</text>
