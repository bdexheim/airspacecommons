<text x="500" y="50.0" font-size="26" font-weight="700" fill="#0B2341" text-anchor="middle">Flights pay their way</text>
<text x="500" y="78.0" font-size="16" font-weight="400" fill="#4E5D6C" text-anchor="middle">Operators ↔ city · brings the resources</text>
<text x="150" y="790" font-size="26" font-weight="700" fill="#0B2341" text-anchor="middle">One sky,</text><text x="150" y="820" font-size="26" font-weight="700" fill="#0B2341" text-anchor="middle">many readers</text>
<text x="150" y="852" font-size="16" font-weight="400" fill="#4E5D6C" text-anchor="middle">Agency ↔ agency</text><text x="150" y="872" font-size="16" font-weight="400" fill="#4E5D6C" text-anchor="middle">brings coordination</text>
<text x="850" y="790" font-size="26" font-weight="700" fill="#0B2341" text-anchor="middle">The sky answers</text><text x="850" y="820" font-size="26" font-weight="700" fill="#0B2341" text-anchor="middle">to the street</text>
<text x="850" y="852" font-size="16" font-weight="400" fill="#4E5D6C" text-anchor="middle">City ↔ residents</text><text x="850" y="872" font-size="16" font-weight="400" fill="#4E5D6C" text-anchor="middle">brings permission</text>
<text x="396" y="360" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">Shared pods,</text><text x="396" y="378" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">one front door</text><text x="396" y="396" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">to operators</text>
<text x="604" y="360" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">Burden budget,</text><text x="604" y="378" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">every flight</text><text x="604" y="396" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">on the ledger</text>
<text x="500" y="544" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">Purpose labels,</text><text x="500" y="562" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">a public vote</text><text x="500" y="580" font-size="14" font-weight="600" fill="#0B2341" text-anchor="middle">for new uses</text>
<text x="500" y="190" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">data paid for in</text><text x="500" y="207" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">access and terms</text>
<text x="318" y="600" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">one map, one queue,</text><text x="318" y="617" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">one backup plan</text>
<text x="682" y="600" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">residents see,</text><text x="682" y="617" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle" font-style="italic">question, say no</text>
<circle cx="500" cy="439" r="40" fill="#D86018"/>
<text x="500" y="436" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">The</text><text x="500" y="452" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">commons</text>
<text x="500" y="748" font-size="15" font-weight="600" fill="#0B2341" text-anchor="middle">Where all three overlap: the commons, a public infrastructure.</text><text x="500" y="768" font-size="15" font-weight="600" fill="#0B2341" text-anchor="middle">Take any ring away and the other two come apart.</text>
<line x1="300" y1="780" x2="700" y2="780" stroke="#4E5D6C" stroke-width="1" stroke-dasharray="4 5"/>
<text x="500" y="806.0" font-size="15" font-weight="700" fill="#0B2341" text-anchor="middle">Built once by the city</text>
<text x="500" y="826.0" font-size="14" font-weight="400" fill="#4E5D6C" text-anchor="middle">base map · payload standard · tasking queue · backup plan</text>
